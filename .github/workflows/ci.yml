name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Versions
        run: |
          node -v
          npm -v
          npx hardhat --version

      - name: Install deps
        run: npm ci

      - name: Compile
        run: npx hardhat compile

      - name: Test
        run: npm test
